# MultiFS Configuration — Example
#
# MultiFS aggregates multiple storage backends (pCloud, local disk) into a single
# S3-compatible object storage endpoint.

[server]
bind = "0.0.0.0"
s3_port = 9000
nfs_port = 2049        # stub — NFS not implemented
enable_s3 = true
enable_nfs = false

# Read-only web UI (browser file navigator; GET-only, no writes/deletes)
enable_web = false
web_port = 9001

[tls]
enabled = false
# cert_path = "/path/to/server.crt"
# key_path  = "/path/to/server.key"
# domain    = "example.com"

[storage]
meta_db_path = "/var/lib/multifs/meta.db"
cache_path = "/var/cache/multifs"
cache_size_mb = 5120
cache_chunks = 10
# "utilization" (tiered, default) or "round-robin"
placement_strategy = "Utilization"   # or "RoundRobin"

# ---- pCloud account (cloud backends default to priority 0 = preferred) ----
[[storage.accounts]]
email = "nova-video-01@agentmail.to"
backend_type = "pcloud"          # "pcloud" or "local"
token_env = "PCLOUD_TOKEN_VIDEO_01"   # env var holding the OAuth token
mount_prefix = "/multifs/01"
quota_gb = 10

[[storage.accounts]]
email = "nova-video-02@agentmail.to"
backend_type = "pcloud"
token_env = "PCLOUD_TOKEN_VIDEO_02"
mount_prefix = "/multifs/02"
quota_gb = 9

# ---- Local disk backend (priority 1 = last resort) ----
# Writes only spill here when every cloud account is full.
[[storage.accounts]]
email = "local-disk"
backend_type = "local"
mount_prefix = "/multifs/local"
path = "/var/lib/multifs/disk"   # required for backend_type = "local"
quota_gb = 80
priority = 1                     # lower = preferred; cloud defaults to 0
