[package]
name = "multifs"
version = "0.1.0"
edition = "2021"
description = "Multi-cloud storage pool with S3 API and WebDAV"
authors = ["Nova Claw <novaclawhk@github.com>"]
license = "MIT"

[[bin]]
name = "multifs"
path = "src/main.rs"

[dependencies]
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }

# Storage
rusqlite = { version = "0.34", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
walkdir = "2"
bytes = "1"
mime_guess = "2"

# WebDAV
http = "1"
http-body-util = "0.1"
hyper = "1"

# Filesystem paths
shellexpand = "3"

# TLS/SSL
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"

# Config
directories = "6"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
