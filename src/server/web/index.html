<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiFS — Read-only Browser</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161a24; --panel2: #1d2330;
    --border: #2a3140; --text: #e6e9ef; --muted: #8b93a7;
    --accent: #4c8dff; --accent2: #6ea8ff;
    --folder: #e6b95c; --file: #7cc4ff; --size: #9aa3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toprow-right { display: flex; align-items: center; gap: 14px; }
  .cols-picker { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .cols-picker select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 13px; cursor: pointer; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent2); }
  .mode-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-switch button {
    background: transparent; color: var(--muted); border: none; cursor: pointer;
    padding: 6px 14px; font-size: 13px; font-weight: 500;
  }
  .mode-switch button.active { background: var(--accent); color: #fff; }
  .crumb {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    margin-top: 8px; font-size: 13px;
  }
  .crumb a { color: var(--accent2); text-decoration: none; cursor: pointer; }
  .crumb a:hover { text-decoration: underline; }
  .crumb .sep { color: var(--muted); }
  .crumb .cur { color: var(--muted); }
  main { padding: 16px 20px; max-width: 1080px; margin: 0 auto; }
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left; font-weight: 500; color: var(--muted);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  .table tr:hover td { background: var(--panel2); }
  .row-link { cursor: pointer; }
  .name { display: flex; align-items: center; gap: 9px; }
  .ico { font-size: 16px; width: 20px; text-align: center; flex: none; }
  .name a { color: var(--text); text-decoration: none; }
  .row-link:hover .name a { color: var(--accent2); }
  .size { color: var(--size); text-align: right; white-space: nowrap; }
  .mtime { color: var(--muted); white-space: nowrap; }
  .ctype { color: var(--muted); font-size: 12px; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    background: #223; color: var(--muted); font-size: 11px; margin-left: 8px;
  }
  .symlink-badge { background: rgba(245,166,35,.15); color: #f5a623; }
  a.file-link { color: var(--accent2); }
  a.vlc-link { color: #f5a623; font-weight: 600; margin-left: 10px; text-decoration: none; white-space: nowrap; }
  a.vlc-link:hover { text-decoration: underline; }
  .spinner { color: var(--muted); padding: 40px 0; text-align: center; }
  .icon-bucket { color: var(--folder); }
  .icon-folder { color: var(--folder); }
  .icon-file { color: var(--file); }
  .icon-img { color: var(--accent2); }
  .name img.fthumb { width: 32px; height: 32px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); flex: none; background: #000; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 4px 0 18px; }
  .gal-item { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .gal-item a { display: block; width: 100%; }
  .gal-item img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border: 1px solid var(--border); border-radius: 6px; background: #000; }
  .gal-label { font-size: 11px; color: var(--muted); }
  .gal-meta { font-size: 11px; color: var(--muted); }
  .folder-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 4px 0 18px; }
  .folder-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 0; }
  .folder-card .fthumb {
    width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); overflow: hidden;
  }
  .folder-card .fthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .folder-card .fthumb .folder-big { font-size: clamp(56px, 18vw, 96px); }
  .folder-card .fname { font-size: 13px; color: var(--text); max-width: 100%; text-align: center; overflow-wrap: anywhere; }
  .folder-card:hover .fname { color: var(--accent2); }
  /* Responsive preview grid: 2-up on phones, 3-up on tablets, 4-up on desktop. */
  @media (min-width: 640px) {
    .gallery, .folder-cards { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 900px) {
    .gallery, .folder-cards { grid-template-columns: repeat(4, 1fr); }
  }
  /* Manual column override (user-selected images per row, beats the auto media queries). */
  body[data-cols="1"] .gallery, body[data-cols="1"] .folder-cards { grid-template-columns: repeat(1, 1fr); }
  body[data-cols="2"] .gallery, body[data-cols="2"] .folder-cards { grid-template-columns: repeat(2, 1fr); }
  body[data-cols="3"] .gallery, body[data-cols="3"] .folder-cards { grid-template-columns: repeat(3, 1fr); }
  body[data-cols="4"] .gallery, body[data-cols="4"] .folder-cards { grid-template-columns: repeat(4, 1fr); }
  body[data-cols="5"] .gallery, body[data-cols="5"] .folder-cards { grid-template-columns: repeat(5, 1fr); }
  body[data-cols="6"] .gallery, body[data-cols="6"] .folder-cards { grid-template-columns: repeat(6, 1fr); }
  /* Names-only mode: a dense, responsive grid of just names. */
  .names-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 14px; margin: 4px 0 18px; }
  .name-item { padding: 3px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name-item a { color: var(--text); text-decoration: none; }
  .name-item:hover { background: var(--panel2); }
  .name-item.folder a { color: var(--folder); }
  .name-item.file a { color: var(--accent2); }
  /* Per-folder preview page (cover → GIF → summary). */
  .folder-detail { display: flex; flex-direction: column; gap: 14px; margin: 4px 0 18px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  .folder-detail .fd-head { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .folder-detail .fd-cover img { max-width: 100%; max-height: 360px; border-radius: 8px; border: 1px solid var(--border); background: #000; object-fit: contain; display: block; }
  .folder-detail .fd-gif img { max-width: 100%; max-height: 280px; border-radius: 8px; border: 1px solid var(--border); background: #000; display: block; }
  .folder-detail .fd-summary { max-height: 480px; overflow: auto; font-size: 13px; line-height: 1.55; color: var(--text); background: var(--panel2); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); }
  .folder-detail .fd-summary h1, .folder-detail .fd-summary h2, .folder-detail .fd-summary h3, .folder-detail .fd-summary h4 { margin: 14px 0 6px; line-height: 1.3; }
  .folder-detail .fd-summary h1 { font-size: 17px; }
  .folder-detail .fd-summary h2 { font-size: 15px; }
  .folder-detail .fd-summary h3, .folder-detail .fd-summary h4 { font-size: 13.5px; }
  .folder-detail .fd-summary p { margin: 6px 0; }
  .folder-detail .fd-summary ul, .folder-detail .fd-summary ol { margin: 6px 0; padding-left: 20px; }
  .folder-detail .fd-summary li { margin: 2px 0; }
  .folder-detail .fd-summary blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--accent2); background: var(--panel); border-radius: 0 6px 6px 0; color: var(--muted); }
  .folder-detail .fd-summary code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .folder-detail .fd-summary pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; }
  .folder-detail .fd-summary pre code { background: none; border: none; padding: 0; }
  .folder-detail .fd-summary table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12.5px; }
  .folder-detail .fd-summary th, .folder-detail .fd-summary td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  .folder-detail .fd-summary th { background: var(--panel); font-weight: 600; }
  .folder-detail .fd-summary hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .folder-detail .fd-summary a { color: var(--accent2); }
  .slide-row { display: flex; justify-content: flex-start; margin-top: 8px; min-height: 0; }
  .slide-row:empty, .slide-row:has(.slide-nav[style*="none"]) { display: none; }
  .slide-nav { display: none; align-items: center; gap: 6px; }
  .slide-nav button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .slide-nav button:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .slide-nav button:disabled { opacity: .35; cursor: default; }
  .slide-nav .slide-pos { color: var(--muted); font-size: 12px; min-width: 54px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1>MultiFS <span>· read-only</span></h1>
    <div class="toprow-right">
      <label class="cols-picker">Cols
        <select id="colsSelect" title="Images per row in preview mode">
          <option value="auto">Auto</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </label>
      <div class="mode-switch" id="modeSwitch">
        <button id="btnList" class="active" data-mode="list">List</button>
        <button id="btnPreview" data-mode="preview">Preview</button>
        <button id="btnNames" data-mode="names">Names</button>
      </div>
    </div>
  </div>
  <div class="slide-row">
    <div class="slide-nav" id="slideNav" title="Previous / next sibling folder">
      <button id="btnPrev" aria-label="Previous folder">◀</button>
      <span id="slidePos" class="slide-pos"></span>
      <button id="btnNext" aria-label="Next folder">▶</button>
    </div>
  </div>
  <div class="crumb" id="crumb"></div>
</header>
<main id="main"><div class="spinner">Loading…</div></main>

<script>
const main = document.getElementById('main');
const crumb = document.getElementById('crumb');
const slideNav = document.getElementById('slideNav');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const slidePos = document.getElementById('slidePos');

// View state — survives navigation so the chosen mode persists.
const state = { bucket: '', prefix: '', mode: 'list', cols: loadCols() };

// Sibling-folder slide state (for prev/next folder navigation).
const siblings = { list: [], index: -1 };

function loadCols() {
  try { return localStorage.getItem('multifs.cols') || 'auto'; } catch (_) { return 'auto'; }
}

function applyCols() {
  if (state.cols === 'auto') document.body.removeAttribute('data-cols');
  else document.body.setAttribute('data-cols', state.cols);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  const units = ['KB','MB','GB','TB'];
  let v = n, i = -1;
  do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
  return v.toFixed(v >= 100 ? 0 : 1) + ' ' + units[i];
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return s;
  return d.toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function isImage(key) {
  return /\.(jpe?g|png|webp|gif)$/i.test(key);
}

function isVideo(key) {
  return /\.(mkv|mp4|avi|mov|webm|m4v|ts|m3u8|flv|wmv)$/i.test(key);
}

function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
}

// Build a platform-appropriate VLC stream link:
//   iOS     -> vlc-x-callback://x-callback-url/stream?url=<encoded abs URL>
//   Windows -> vlc://<absolute download URL>
function vlcStreamUrl(bucket, key) {
  const abs = window.location.origin + '/api/download?' + new URLSearchParams({ bucket, key });
  if (isIOS()) {
    return 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(abs);
  }
  // Desktop VLC mangles a nested scheme (vlc://http://… -> vlc://http//…), so
  // percent-encode the whole URL so the http:// scheme survives intact.
  return 'vlc://' + encodeURIComponent(abs);
}

function friendlyLabel(name) {
  const m = name.match(/frame_(\d{2})(\d{2})(\d{2})/i);
  if (m) return `${m[1]}:${m[2]}:${m[3]}`;
  if (/cover/i.test(name)) return 'cover';
  return name;
}

async function jfetch(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ('HTTP ' + r.status));
  return r.json();
}

function renderCrumb(bucket, prefix) {
  crumb.innerHTML = '';
  const root = document.createElement('a');
  root.textContent = 'Buckets';
  root.onclick = () => navigate('', '');
  crumb.appendChild(root);
  if (bucket) {
    crumb.appendChild(sep());
    const b = document.createElement('a');
    b.textContent = bucket;
    b.onclick = () => navigate(bucket, '');
    crumb.appendChild(b);
    const parts = prefix.split('/').filter(Boolean);
    let acc = '';
    for (let i = 0; i < parts.length; i++) {
      acc += parts[i] + '/';
      crumb.appendChild(sep());
      const p = document.createElement('a');
      p.textContent = parts[i];
      const target = acc;
      p.onclick = () => navigate(bucket, target);
      crumb.appendChild(p);
    }
  }
}

function sep() {
  const s = document.createElement('span');
  s.className = 'sep';
  s.textContent = '›';
  return s;
}

// --- Sibling-folder slide navigation (prev/next) ---
// When inside a folder prefix, resolve the sorted list of sibling folders in the
// same parent, then enable ◀ / ▶ to jump between them (slide through folders).
function parentOf(prefix) {
  if (!prefix) return '';
  const parts = prefix.split('/').filter(Boolean);
  if (!parts.length) return '';
  parts.pop();
  return parts.length ? parts.join('/') + '/' : '';
}

function siblingOrder(prefix) {
  // A folder's key is its full prefix (e.g. video-subtitle/blor-116/).
  // Sort siblings by their final path segment (natural-ish string sort).
  const parts = prefix.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '';
}

async function resolveSiblings() {
  siblings.list = []; siblings.index = -1;
  slideNav.style.display = 'none';
  if (!state.bucket || !state.prefix) return;

  const parent = parentOf(state.prefix);
  const q = new URLSearchParams({ bucket: state.bucket });
  if (parent) q.set('prefix', parent);
  try {
    const data = await jfetch('/api/list?' + q.toString());
    const folders = (data.prefixes || []).map(p => typeof p === 'string' ? p : p.prefix);
    // Only folders at the *immediate* child level of `parent`.
    const depth = parent ? parent.split('/').filter(Boolean).length + 1 : 1;
    siblings.list = folders.filter(p => {
      const segs = p.replace(/\/$/, '').split('/').filter(Boolean);
      return segs.length === depth;
    }).sort((a, b) => siblingOrder(a).localeCompare(siblingOrder(b), undefined, { numeric: true }));
    siblings.index = siblings.list.indexOf(state.prefix.replace(/\/$/, '') + '/');
    if (siblings.index === -1) {
      // tolerate missing trailing slash
      siblings.index = siblings.list.findIndex(p => p.replace(/\/$/, '') === state.prefix.replace(/\/$/, ''));
    }
    if (siblings.index >= 0) {
      slideNav.style.display = 'inline-flex';
      updateSlideButtons();
    }
  } catch (_) { /* ignore: prev/next just stays hidden */ }
}

function updateSlideButtons() {
  btnPrev.disabled = siblings.index <= 0;
  btnNext.disabled = siblings.index >= siblings.list.length - 1;
  slidePos.textContent = `${siblings.index + 1} / ${siblings.list.length}`;
}

btnPrev.addEventListener('click', () => {
  if (siblings.index > 0) {
    navigate(state.bucket, siblings.list[siblings.index - 1]);
  }
});
btnNext.addEventListener('click', () => {
  if (siblings.index >= 0 && siblings.index < siblings.list.length - 1) {
    navigate(state.bucket, siblings.list[siblings.index + 1]);
  }
});

// --- URL routing (hash-based) ---
//   #/                          -> bucket list (root)
//   #/b/<bucket>                -> bucket root
//   #/b/<bucket>/<prefix/...>   -> folder prefix
// Lets the browser back/forward buttons and bookmarks work.
function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (_) { return s; }
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  if (!raw) return { bucket: '', prefix: '' };
  const parts = raw.split('/');
  if (parts[0] === 'b' && parts.length >= 2) {
    const bucket = safeDecode(parts[1]);
    const prefix = parts.slice(2).map(safeDecode).join('/');
    return { bucket, prefix };
  }
  return { bucket: '', prefix: '' };
}

function toHash(bucket, prefix) {
  if (!bucket) return '#/';
  let h = '#/b/' + encodeURIComponent(bucket);
  if (prefix) h += '/' + prefix.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return h;
}

function navigate(bucket, prefix) {
  const h = toHash(bucket, prefix);
  if (window.location.hash === h) {
    loadFromHash();           // already on this hash — just (re)render
  } else {
    window.location.hash = h; // triggers hashchange -> loadFromHash
  }
}

function loadFromHash() {
  const { bucket, prefix } = parseHash();
  if (bucket) loadList(bucket, prefix);
  else loadBuckets();
}

window.addEventListener('hashchange', loadFromHash);

function setMode(mode) {
  state.mode = mode;
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  document.getElementById('btnPreview').classList.toggle('active', mode === 'preview');
  document.getElementById('btnNames').classList.toggle('active', mode === 'names');
  // Re-render the current view under the new mode.
  if (state.bucket) loadList(state.bucket, state.prefix);
}

document.getElementById('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn) setMode(btn.dataset.mode);
});

document.getElementById('colsSelect').addEventListener('change', e => {
  state.cols = e.target.value;
  try { localStorage.setItem('multifs.cols', state.cols); } catch (_) {}
  applyCols();
  if (state.bucket) loadList(state.bucket, state.prefix);
});

async function loadBuckets() {
  state.bucket = ''; state.prefix = '';
  renderCrumb('', '');
  slideNav.style.display = 'none';
  siblings.list = []; siblings.index = -1;
  main.innerHTML = '<div class="spinner">Loading buckets…</div>';
  try {
    const data = await jfetch('/api/buckets');
    const buckets = data.buckets || [];
    if (!buckets.length) {
      main.innerHTML = '<div class="empty">No buckets yet.</div>';
      return;
    }
    let html = '<table class="table"><thead><tr><th>Name</th><th>Created</th></tr></thead><tbody>';
    for (const b of buckets) {
      html += `<tr class="row-link" data-bucket="${esc(b.name)}">
        <td><div class="name"><span class="ico icon-bucket">🗂</span><a>${esc(b.name)}</a></div></td>
        <td class="mtime">${esc(fmtDate(b.created_at))}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    main.innerHTML = html;
    main.querySelectorAll('tr.row-link').forEach(tr => {
      tr.onclick = () => navigate(tr.dataset.bucket, '');
    });
  } catch (e) {
    main.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

function folderRowHtml(bucket, f, showThumb) {
  const prefix = typeof f === 'string' ? f : f.prefix;
  const name = prefix.replace(/\/$/, '').split('/').pop();
  // Show the folder's cover image only in preview mode (and only when
  // recorded + present); otherwise keep the standard folder icon.
  let ico;
  if (showThumb && f && f.cover_key) {
    const purl = '/api/download?' + new URLSearchParams({ bucket, key: f.cover_key });
    ico = `<img class="fthumb" src="${esc(purl)}" alt="" loading="lazy">`;
  } else {
    ico = '<span class="ico icon-folder">📁</span>';
  }
  return `<tr class="row-link" data-prefix="${esc(prefix)}">
    <td><div class="name">${ico}<a>${esc(name)}/</a>${childBadge(f)}${symlinkBadge(f)}</div></td>
    <td class="size"></td><td class="mtime"></td><td class="ctype"></td>
  </tr>`;
}

// Small "N items" badge for a folder, showing its direct child count.
function childBadge(f) {
  const cc = (f && typeof f.child_count === 'number') ? f.child_count : null;
  if (cc == null) return '';
  const label = cc === 1 ? '1 item' : cc + ' items';
  return `<span class="badge">${label}</span>`;
}

// Badge marking a folder that is a symlink (tag folder).
function symlinkBadge(f) {
  if (!(f && f.is_symlink)) return '';
  return `<span class="badge symlink-badge" title="Tag folder (symlink)">🔗</span>`;
}

function fileRowHtml(bucket, f, showPreviewCol) {
  const name = f.key.split('/').pop();
  const durl = '/api/download?' + new URLSearchParams({ bucket, key: f.key });
  const ico = isImage(f.key) ? '<span class="ico icon-img">🖼</span>' : '<span class="ico icon-file">📄</span>';
  const ctype = f.content_type || '';
  // Always offer a VLC stream link next to video downloads (all devices).
  let vlc = '';
  if (isVideo(f.key)) {
    vlc = `<a class="vlc-link" href="${esc(vlcStreamUrl(bucket, f.key))}" title="Open in VLC">▶ VLC</a>`;
  }
  let row = `<tr>
    <td><div class="name">${ico}<a class="file-link" href="${esc(durl)}">${esc(name)}</a>${vlc}</div></td>
    <td class="size">${esc(fmtSize(f.size))}</td>
    <td class="mtime">${esc(fmtDate(f.last_modified))}</td>
    <td class="ctype">${esc(ctype)}</td>
  </tr>`;
  return row;
}

function renderListMode(bucket, folders, files) {
  let html = '<table class="table"><thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Type</th></tr></thead><tbody>';
  for (const f of folders) html += folderRowHtml(bucket, f, false);
  for (const f of files) html += fileRowHtml(bucket, f);
  html += '</tbody></table>';
  return html;
}

function renderNamesMode(bucket, folders, files) {
  let html = '<div class="names-grid">';
  for (const f of folders) {
    const prefix = typeof f === 'string' ? f : f.prefix;
    const name = prefix.replace(/\/$/, '').split('/').pop();
    html += `<div class="name-item folder" data-prefix="${esc(prefix)}"><a>${esc(name)}/</a>${childBadge(f)}${symlinkBadge(f)}</div>`;
  }
  for (const f of files) {
    const name = f.key.split('/').pop();
    const durl = '/api/download?' + new URLSearchParams({ bucket, key: f.key });
    html += `<div class="name-item file"><a class="file-link" href="${esc(durl)}">${esc(name)}</a></div>`;
  }
  html += '</div>';
  return html;
}

function renderPreviewMode(bucket, folders, files) {
  const images = files.filter(f => isImage(f.key));
  const others = files.filter(f => !isImage(f.key));
  const withPreview = folders.filter(f => f && f.cover_key);
  const noPreview = folders.filter(f => !(f && f.cover_key));
  let html = '';
  if (images.length) {
    html += '<div class="gallery">';
    for (const f of images) {
      const name = f.key.split('/').pop();
      const durl = '/api/download?' + new URLSearchParams({ bucket, key: f.key });
      html += `<div class="gal-item">
        <a href="${esc(durl)}" target="_blank"><img src="${esc(durl)}" loading="lazy" alt="${esc(name)}"></a>
        <div class="gal-label">${esc(friendlyLabel(name))}</div>
        <div class="gal-meta">${esc(fmtSize(f.size))}</div>
      </div>`;
    }
    html += '</div>';
  }
  // Folders with a preview image get large cards (big cover thumbnail).
  if (withPreview.length) {
    html += '<div class="folder-cards">';
    for (const f of withPreview) {
      const prefix = f.prefix;
      const name = prefix.replace(/\/$/, '').split('/').pop();
      const purl = '/api/download?' + new URLSearchParams({ bucket, key: f.cover_key });
      html += `<div class="folder-card" data-prefix="${esc(prefix)}">
        <div class="fthumb"><img src="${esc(purl)}" loading="lazy" alt="${esc(name)}"></div>
        <div class="fname">${esc(name)}${childBadge(f)}${symlinkBadge(f)}</div>
      </div>`;
    }
    html += '</div>';
  }
  // Folders without a preview image stay as rows with the folder icon.
  if (noPreview.length || others.length) {
    html += '<table class="table"><thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Type</th></tr></thead><tbody>';
    for (const f of noPreview) html += folderRowHtml(bucket, f, false);
    for (const f of others) html += fileRowHtml(bucket, f);
    html += '</tbody></table>';
  }
  return html;
}

// Per-folder preview page: render cover image → GIF → summary (skip missing).
function renderFolderDetail(bucket, folder) {
  if (!folder) return '';
  let html = '<div class="folder-detail">';
  if (folder.cover_key) {
    const u = '/api/download?' + new URLSearchParams({ bucket, key: folder.cover_key });
    html += `<div><div class="fd-head">Cover</div><div class="fd-cover"><img src="${esc(u)}" alt="cover"></div></div>`;
  }
  if (folder.preview_gif_key) {
    const u = '/api/download?' + new URLSearchParams({ bucket, key: folder.preview_gif_key });
    html += `<div><div class="fd-head">Preview</div><div class="fd-gif"><img src="${esc(u)}" alt="preview"></div></div>`;
  }
  if (folder.summary_key) {
    html += `<div><div class="fd-head">Summary</div><div class="fd-summary" id="fdSummary">Loading…</div></div>`;
  }
  html += '</div>';
  return html;
}

// Fetch and display the folder's summary: JSON → structured card, else Markdown → HTML.
function loadSummaryText(bucket, folder) {
  if (!folder || !folder.summary_key) return;
  const isJson = /\.json$/i.test(folder.summary_key);
  const u = '/api/download?' + new URLSearchParams({ bucket, key: folder.summary_key });
  fetch(u)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => {
      const el = document.getElementById('fdSummary');
      if (!el) return;
      el.innerHTML = isJson ? jsonToHtml(text) : mdToHtml(text);
    })
    .catch(() => {
      const el = document.getElementById('fdSummary');
      if (el) el.textContent = '(summary unavailable)';
    });
}

// Render a structured content-summary JSON (the video-subtitle pipeline schema:
// code/title/studio/release_date/duration/rating/story/description/actors/tags/sources)
// into a clean HTML card. Degrades gracefully to the raw JSON if parsing fails.
function jsonToHtml(text) {
  let d;
  try { d = JSON.parse(text); } catch (_) { return '<pre>' + esc(text) + '</pre>'; }
  if (!d || typeof d !== 'object') return '<pre>' + esc(text) + '</pre>';

  const val = (v) => (v == null || v === '' ? null : v);
  const txt = (v) => { const s = val(v); return s == null ? null : esc(String(s)); };
  const rows = [];
  const kv = (k, v) => rows.push('<div class="fs-row"><span class="fs-k">' + esc(k) + '</span><span class="fs-v">' + v + '</span></div>');

  // Title (prefer zh_hk, fall back to ja)
  if (d.title && typeof d.title === 'object') {
    const t = val(d.title.zh_hk) || val(d.title.ja);
    if (t) rows.push('<div class="fs-title">' + esc(String(t)) + '</div>');
    if (d.title.ja && d.title.zh_hk && d.title.ja !== d.title.zh_hk) {
      kv('日文片名', esc(String(d.title.ja)));
    }
  }
  if (d.code) kv('品番', esc(String(d.code)));

  const studio = d.studio && d.studio.value ? d.studio.value : d.studio;
  if (val(studio)) kv('片商', esc(String(studio)));
  const rd = d.release_date && d.release_date.value ? d.release_date.value : d.release_date;
  if (val(rd)) kv('發售日', esc(String(rd)));
  const dur = d.duration && d.duration.value ? d.duration.value : d.duration;
  if (val(dur)) kv('片長', esc(String(dur)));

  if (Array.isArray(d.rating) && d.rating.length) {
    const r = d.rating[0];
    if (r && (r.value != null)) {
      const scale = r.scale || 5;
      const stars = '★'.repeat(Math.max(0, Math.round(r.value))) + '☆'.repeat(Math.max(0, scale - Math.round(r.value)));
      const votes = r.votes ? ' (' + r.votes + ' 票)' : '';
      kv('評分', esc(stars + ' ' + r.value + '/' + scale + votes));
    }
  }

  if (val(d.story)) kv('故事', esc(String(d.story)));
  if (val(d.description)) kv('簡介', esc(String(d.description)));

  if (Array.isArray(d.actors) && d.actors.length) {
    const names = d.actors.map(a => (typeof a === 'string' ? a : (a.canonical || (a.name || '')))).filter(Boolean);
    if (names.length) kv('出演者', esc(names.join('、')));
  }

  if (d.tags && typeof d.tags === 'object') {
    const parts = [];
    for (const [cat, list] of Object.entries(d.tags)) {
      if (Array.isArray(list) && list.length) parts.push(cat + '：' + list.join('、'));
    }
    if (parts.length) kv('標籤', esc(parts.join('　')));
  }

  if (Array.isArray(d.sources) && d.sources.length) {
    const links = d.sources.map(u => '<a href="' + esc(String(u)) + '" target="_blank" rel="noopener">' + esc(String(u)) + '</a>');
    rows.push('<div class="fs-row"><span class="fs-k">來源</span><span class="fs-v">' + links.join('<br>') + '</span></div>');
  }

  if (!rows.length) return '<pre>' + esc(text) + '</pre>';
  return '<div class="fs-card">' + rows.join('') + '</div>';
}

// Minimal, safe Markdown → HTML renderer. Escapes raw HTML first, then
// converts the common block/inline constructs the summary files use:
// headings, blockquotes, tables, lists, code spans, bold/italic, links, hr.
function mdToHtml(md) {
  const src = String(md || '').replace(/\r\n?/g, '\n');
  const lines = src.split('\n');
  const out = [];
  let i = 0;

  const inline = (s) => {
    let t = esc(s);
    // code spans first (protect backticks from later passes)
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    // bold, then italic
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    // inline links [text](url)
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // restore code spans
    t = t.replace(/\u0000(\d+)\u0000/g, (m, k) => '<code>' + codes[+k] + '</code>');
    return t;
  };

  const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const isTableSep = (l) => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const splitRow = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

  while (i < lines.length) {
    const line = lines[i];
    const t = line.trim();

    if (!t) { i++; continue; }

    // fenced code block
    if (/^```/.test(t)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
      i++; // skip closing fence
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }

    // heading
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    if (h) {
      const lvl = Math.min(h[1].length, 6);
      out.push('<h' + lvl + '>' + inline(h[2]) + '</h' + lvl + '>');
      i++;
      continue;
    }

    // horizontal rule
    if (/^([-*_])\s*\1\s*\1[\s\1]*$/.test(t)) { out.push('<hr>'); i++; continue; }

    // blockquote
    if (/^>\s?/.test(t)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
        buf.push(lines[i].trim().replace(/^>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + inline(buf.join('<br>')) + '</blockquote>');
      continue;
    }

    // table (header row + separator row)
    if (isTableRow(t) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = splitRow(t);
      i += 2;
      const body = [];
      while (i < lines.length && isTableRow(lines[i].trim())) { body.push(splitRow(lines[i].trim())); i++; }
      let html = '<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      for (const r of body) html += '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      html += '</tbody></table>';
      out.push(html);
      continue;
    }

    // unordered list
    if (/^[-*+]\s+/.test(t)) {
      const buf = [];
      while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
        buf.push('<li>' + inline(lines[i].trim().replace(/^[-*+]\s+/, '')) + '</li>');
        i++;
      }
      out.push('<ul>' + buf.join('') + '</ul>');
      continue;
    }

    // ordered list
    if (/^\d+\.\s+/.test(t)) {
      const buf = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
        buf.push('<li>' + inline(lines[i].trim().replace(/^\d+\.\s+/, '')) + '</li>');
        i++;
      }
      out.push('<ol>' + buf.join('') + '</ol>');
      continue;
    }

    // paragraph (gather consecutive plain lines, stop at block constructs)
    const buf = [];
    const isBlockStart = (l) => {
      const x = l.trim();
      return !x
        || /^```/.test(x)
        || /^#{1,6}\s+/.test(x)
        || /^>\s?/.test(x)
        || /^[-*+]\s+/.test(x)
        || /^\d+\.\s+/.test(x)
        || /^([-*_])\s*\1\s*\1[\s\1]*$/.test(x)
        || isTableRow(x);
    };
    while (i < lines.length && !isBlockStart(lines[i])) {
      buf.push(lines[i].trim());
      i++;
    }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }

  return out.join('\n');
}

async function loadList(bucket, prefix) {
  state.bucket = bucket; state.prefix = prefix;
  renderCrumb(bucket, prefix);
  main.innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const q = new URLSearchParams({ bucket });
    if (prefix) q.set('prefix', prefix);
    const data = await jfetch('/api/list?' + q.toString());
    const folders = data.prefixes || [];
    const files = data.files || [];

    // Per-folder preview page (cover → GIF → summary) shown at the top when
    // the current folder has recorded metadata.
    const detail = renderFolderDetail(bucket, data.folder);

    if (!folders.length && !files.length && !detail) {
      main.innerHTML = '<div class="empty">This folder is empty.</div>';
      return;
    }

    let html = detail + (state.mode === 'preview'
      ? renderPreviewMode(bucket, folders, files)
      : state.mode === 'names'
        ? renderNamesMode(bucket, folders, files)
        : renderListMode(bucket, folders, files));

    if (data.truncated) html += '<div class="note">⚠ Listing truncated (very large folder).</div>';
    html += '<div class="note">Read-only — downloads only. Range requests supported for streaming.</div>';
    main.innerHTML = html;
    loadSummaryText(bucket, data.folder);
    main.querySelectorAll('tr.row-link').forEach(tr => {
      tr.onclick = () => navigate(bucket, tr.dataset.prefix);
    });
    main.querySelectorAll('.folder-card').forEach(card => {
      card.onclick = () => navigate(bucket, card.dataset.prefix);
    });
    main.querySelectorAll('.name-item[data-prefix]').forEach(el => {
      el.onclick = () => navigate(bucket, el.dataset.prefix);
    });
    resolveSiblings();
  } catch (e) {
    main.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

document.getElementById('colsSelect').value = state.cols;
applyCols();
loadFromHash();
</script>
